<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Board — zeda.dev</title>
  <link rel="stylesheet" href="/assets/board.css">
</head>
<body class="index-page">
  <div class="progress" id="progress"></div>

  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">◈</span><span>Board</span></a>
    <div class="topbar-meta">
      <span class="badge badge-soft">özel</span>
      <form method="post" action="/logout" class="inline-form">
        <button class="btn btn-ghost" type="submit">Çıkış</button>
      </form>
    </div>
  </header>

  <main class="index-wrap">
    <div class="hero index-hero">
      <div class="eyebrow">zeda.dev</div>
      <h1>Board</h1>
      <p class="lede">Raporlar, analizler ve etkileşimli sayfalar. Yalnızca davetli erişim.</p>
    </div>
    <div class="report-grid">
      {{content}}
    </div>
    <footer class="footer">
      <span>Board · zeda.dev</span>
      <span>noindex · password protected</span>
    </footer>
  </main>
</body>
</html>
